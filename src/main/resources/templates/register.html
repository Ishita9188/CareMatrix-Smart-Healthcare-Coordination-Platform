<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CareMatrix Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #20c997);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            color: white;
        }

        .register-card h3 {
            font-weight: 600;
            margin-bottom: 25px;
        }

        .brand-text {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
            border-color: white;
        }

        .btn-success {
            border-radius: 10px;
            font-weight: 500;
            padding: 10px;
            background-color: #ffffff;
            color: #198754;
            border: none;
            transition: 0.3s ease;
        }

        .btn-success:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }

        select {
            border-radius: 10px;
        }

        .form-section {
            text-align: left;
        }
    </style>
</head>

<body>

<div class="register-card text-center">

    <div class="brand-text">CareMatrix</div>
    <div class="subtitle">Smart Healthcare Management Platform</div>

    <h3>User Registration</h3>

    <form th:action="@{/registerUser}" method="post" th:object="${user}" class="form-section">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Role</label>
            <select th:field="*{role}" class="form-control" id="roleSelect">
                <option value="PATIENT">Patient</option>
                <option value="DOCTOR">Doctor</option>
                <option value="RURAL_CLINIC">Rural Clinic</option>
                <option value="INSURANCE">Insurance Officer</option>
                <option value="SUSTAINABILITY">Sustainability Manager</option>
                <option value="ADMIN">Admin (Only One)</option>
            </select>
        </div>

        <div class="mb-3" id="clinicAddressDiv" style="display:none;">
            <label>Clinic Address</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="mb-3" id="ruralSpecialistDiv" style="display:none;">
            <label>Specialist for Rural Clinics?</label>
            <select th:field="*{ruralSpecialist}" class="form-control">
                <option value="NO" selected>No</option>
                <option value="YES">Yes</option>
            </select>
        </div>

        <button class="btn btn-success w-100 mt-3">Register</button>
        <div class="mt-2" th:if="${error != null}">
            <span class="text-danger" th:text="${error}"></span>
        </div>

    </form>

</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const addressDiv = document.getElementById('clinicAddressDiv');
    const ruralDiv = document.getElementById('ruralSpecialistDiv');

    roleSelect.addEventListener('change', function() {
        if (this.value === 'RURAL_CLINIC') {
            addressDiv.style.display = 'block';
            ruralDiv.style.display = 'none';
        } else if (this.value === 'DOCTOR') {
            ruralDiv.style.display = 'block';
            addressDiv.style.display = 'none';
        } else {
            addressDiv.style.display = 'none';
            ruralDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
