<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
    background: linear-gradient(135deg, #eef3f9, #e6f0ff);
    font-family: 'Segoe UI', sans-serif;
}

.dashboard-title {
    font-weight: 600;
    color: #0d6efd;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.dashboard-title i {
    font-size: 28px;
}

.logout-section {
    margin-top: 40px;
    margin-bottom: 60px; 
}

        h2 {
            font-weight: 600;
            color: #0d6efd;
        }

        .dashboard-card {
            border-radius: 15px;
            border: none;
            background: #ffffff;
            transition: 0.3s ease;
            animation: fadeInUp 0.6s ease forwards;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .dashboard-card h4 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #198754;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            transition: 0.2s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13,110,253,0.25);
        }

        .btn-primary {
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13,110,253,0.25);
        }

        .btn-secondary {
            border-radius: 8px;
            padding: 8px 20px;
        }

        hr {
            opacity: 0.2;
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-delay-1 { animation-delay: 0.2s; }
        .section-delay-2 { animation-delay: 0.4s; }
        .section-delay-3 { animation-delay: 0.6s; }

    </style>
</head>

<body>

<div class="container mt-4">

    <h2 class="dashboard-title mb-4">
    <i class="bi bi-heart-pulse-fill text-danger"></i>
    Patient Dashboard
</h2>

    <div class="card dashboard-card p-4 mb-4 shadow section-delay-1">
        <h4>Enter Daily Vitals</h4>

        <form action="/submit_vitals" method="post">
            
            <input type="hidden" name="patientEmail" th:value="${patientEmail}" />

            <div class="mb-3">
                <label>Heart Rate</label>
                <input type="number" name="heartRate" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Systolic BP</label>
                <input type="number" name="systolicBP" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Diastolic BP</label>
                <input type="number" name="diastolicBP" class="form-control" required>
            </div>

            <button class="btn btn-primary">Submit Vitals</button>
        </form>
        <div class="mt-2" th:if="${message != null}">
            <span class="text-danger" th:text="${message}"></span>
            <span class="text-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></span>
            <span class="text-success" th:if="${successMessage != null}" th:text="${successMessage}"></span>
        </div>
    </div>

    <div class="card dashboard-card p-4 mb-4 shadow section-delay-2">
        <h4>Book Appointment</h4>

        <form action="/bookAppointment" method="post">

            <input type="hidden" name="patientEmail" th:value="${patientEmail}" />

            <div class="mb-3">
                <label>Specialization</label>
                <select name="specialization" class="form-control">
                    <option value="Cardiology">Cardiology</option>
                    <option value="General">General</option>
                    <option value="Orthopedic">Orthopedic</option>
                    <option value="Neurology">Neurology</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date" name="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Time</label>
                <input type="time" name="time" class="form-control" required>
            </div>

            <button class="btn btn-primary">Book Appointment</button>
        </form>

        <div class="mt-2" th:if="${message != null}">
            <span class="text-danger" th:text="${message}"></span>
            <span class="text-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></span>
            <span class="text-success" th:if="${successMessage != null}" th:text="${successMessage}"></span>
        </div>
    </div>

    <div class="card dashboard-card p-4 mb-4 shadow section-delay-3">
        <h4>File Insurance Claim</h4>

        <form th:action="@{/fileInsuranceClaim}" method="post" enctype="multipart/form-data">

            <input type="hidden" name="patientEmail" th:value="${patientEmail}" />

            <div class="mb-3">
                <label>Claim Amount</label>
                <input type="number" name="claimAmount" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Reason</label>
                <input type="text" name="reason" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Incident Date</label>
                <input type="date" name="incidentDate" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Incident Location</label>
                <input type="text" name="incidentLocation" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Supporting Document (PDF/Image)</label>
                <input type="file" name="documentFile" class="form-control">
            </div>

            <button class="btn btn-primary">Submit Claim</button>
        </form>
    </div>

    <div class="logout-section text-center">
    <a href="/" class="btn btn-secondary px-4">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

</div>

</body>
</html>
